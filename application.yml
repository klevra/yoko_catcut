app:
  server:
    host: 0.0.0.0
    backend_port: 8000
    frontend_port: 3000
    websocket_port: 8000

  workspace:
    root_path: ./workspace

  storage:
    type: local

  auth:
    users_file: ./workspace/.system/accounts/users.json

  runtime:
    os: docker-image
    supported_os:
      - win
      - mac
      - rhel
      - ubuntu
      - docker-image

  nas:
    enabled: false
    protocol: smb
    host: 192.168.0.10
    port: 445
    share_name: video
    username: user
    password: password

  upload:
    max_file_size_gb: 10
    max_concurrent_uploads: 5

  model:
    whisper_path: ./models/whisper
    whisper_model: base
    device: cpu

  ffmpeg:
    binary: ffmpeg
    probe_binary: ffprobe
    subtitle_font: Noto Sans CJK KR

  logging:
    level: INFO
    path: ./logs

  retention:
    upload_days: 30
    output_days: 30
    log_days: 90

  cors:
    allowed_origins:
      - "*"
