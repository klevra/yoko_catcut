services:
  backend:
    build:
      context: ./backend
    container_name: "${BACKEND_CONTAINER_NAME:-yoko_catcut_backend}"
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_CONTAINER_PORT:-8000}"
    volumes:
      - ./application.yml:/app/application.yml
      - ./workspace:/app/workspace
      - ./models:/app/models
      - ./logs:/app/logs
    environment:
      - YOKO_CONFIG=/app/application.yml

  frontend:
    build:
      context: ./frontend
    container_name: "${FRONTEND_CONTAINER_NAME:-yoko_catcut_frontend}"
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-3000}"
    depends_on:
      - backend
